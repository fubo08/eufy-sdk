name: T8N00 Linux verification
on:
  push:
    branches: [test/t8n00-native-rtc-verify]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.5.0
          cache: npm
      - run: npm ci
      - name: Supply the optional RTC peer for type checking
        run: |
          npm pack node-datachannel@0.33.4 --pack-destination "$RUNNER_TEMP"
          mkdir -p node_modules/node-datachannel
          tar -xzf "$RUNNER_TEMP/node-datachannel-0.33.4.tgz" -C node_modules/node-datachannel --strip-components=1
      - run: npm run verify
