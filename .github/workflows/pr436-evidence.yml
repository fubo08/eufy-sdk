name: NVR media refactor verification
on:
  push:
    branches: [test/pr436-refactor-ci]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.5.0
          cache: npm
      - run: npm ci
      - name: Public caller regression on unchanged beta routing
        shell: bash
        run: |
          cp src/client/eufy-mega.ts /tmp/eufy-fixed.ts
          trap 'cp /tmp/eufy-fixed.ts src/client/eufy-mega.ts' EXIT
          git show a586a0b9c357647d4a738e03ea507571fc02c286:src/client/eufy-mega.ts > src/client/eufy-mega.ts
          set +e
          npx vitest run src/client/__tests__/nvr-media-routing.spec.ts -t 'binds' > /tmp/before.log 2>&1
          result=$?
          set -e
          cat /tmp/before.log
          test "$result" -eq 1
          grep -q '2 failed' /tmp/before.log
          grep -q 'mediaProviderFor' /tmp/before.log
      - name: Full verification
        run: npm run verify
